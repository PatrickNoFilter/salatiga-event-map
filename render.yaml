# Render Blueprint: Salatiga Event Map on the free tier.
# One Docker web service (API + static site, same origin).
# DATABASE_URL is prompted at Blueprint creation (Neon direct host,
# sslmode=require). ADMIN_TOKEN is generated by Render.
services:
  - type: web
    name: salatiga-event-map
    runtime: docker
    dockerfilePath: ./deploy/render.Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
