[package]
name = "shared"
version = "0.1.1"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
sqlx = { version = "0.8", features = ["postgres", "chrono", "uuid"], optional = true }

[features]
default = []
sqlx = ["dep:sqlx"]
